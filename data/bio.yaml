# Homepage introduction. Each list item is one paragraph.
# Markdown is supported (e.g. [text](https://url) links open in a new tab; _text_ is italic).
paragraphs:
  - "Welcome! I am a Ph.D. candidate in Political Science at Yale University, with research interests spanning comparative politics,  international relations, and public policy. My research focuses on the causes and consequences of rulers’ politicization of their bureaucracies, specifically the military and police. A secondary research area extends into the international arena, examining the effects of autocratic states’ foreign interference and security assistance on recipient countries’ public opinion." 
  - |-
    Analyzing how autocrats manage their bureaucracies matters for understanding the legacies of politicization in areas such as public sector reform after democratization, electoral behavior, and social cohesion. Three questions on these typically opaque security bureaucracies animate my research agenda:

    - _Who stays loyal to the regime as domestic opposition mounts?_
    - _How do autocrats use bureaucratic postings for electoral advantage?_
    - _How does regime propaganda shape security personnel's loyalty?_ 
  - "With a regional focus on Southeast Asia, I use multi-method designs to shed light on the relationships between autocrats, state bureaucracies, and the masses. Examining politicization requires careful inference across different levels of analysis. At the _macro-level_, I use survey and electoral data to understand political preferences and perceptions among the general public and public sector organizations. Government and private archives help provide _meso-level_ insights into how these bureaucratic organizations work in practice, their subcultures, and how bonds of solidarity develop or fray in the workplace. At the _micro-level_, I interview bureaucrats to understand why they joined or left the public sector, and their lived experiences while serving the country. These different approaches document the quiet but important contributions of government bureaucrats, whose aggregate behaviors are only captured in part by scholarly measures of state- and nation-building."
  - "My research has been generously supported by the [Institute for Humane Studies](https://www.theihs.org/), the [Japan Foundation](https://www.jpf.go.jp/e/), the [National University of Singapore](https://nus.edu.sg/), the [Social Science Research Council (Singapore)](https://www.ssrc.edu.sg/), the [Southeast Asia Research Group (SEAREG)](https://seareg.org/), and [Yale's MacMillan Center](https://macmillan.yale.edu/)."
  - "My dissertation is chaired by [Kate Baldwin](https://campuspress.yale.edu/katebaldwin/) and [Jennifer Gandhi](https://www.jennifergandhi.com/), with [Elisabeth Wood](https://campuspress.yale.edu/elisabethwood/), [Daniel Mattingly](https://campuspress.yale.edu/mattingly/), and [Elizabeth Parker-Magyar](https://biffpm.github.io/)."
