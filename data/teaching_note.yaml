# Intro paragraph shown under the Teaching heading. HTML links are allowed.
text: "At Yale and the National University of Singapore, I’ve taught classes in comparative politics, international relations, Southeast Asia, and mixed methods. As an alumnus of the <a href=\"https://www.bridgingthegapproject.org/new-era-workshop\" target=\"_blank\" rel=\"noopener\">Bridging the Gap Project</a> workshop and <a href=\"https://ssp.mit.edu/wargaming-lab/about\" target=\"_blank\" rel=\"noopener\">MIT Security Studies Program Wargaming Lab</a> Summer Institute, I seek to connect research with policy in my lessons. Please feel free to contact me for teaching materials and the complete set of evaluations."
