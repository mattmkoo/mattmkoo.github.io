# Intro paragraph shown above the Field Notes photos. Markdown supported (_text_ = italic).
intro: "No research plan survives first contact with the field. I’m grateful for the many conversations with regional experts, interviewees, and of course my committee that have made my research more sensitive to case context while focused still on salient questions in the political science discipline. From the dusty files of an archive to the dining tables of interviewees, here are some visual snippets from a journey that took me to Australia, Canada, Malaysia, Singapore, and the UK for archival research and interviews. _Terima kasih_ (thank you) to everyone—both furry and non-furry—who were part of this journey."
