- title: "Who Stays Loyal? Security Personnel Support in Autocratic Elections"
  section: working
  status: "under review"
  job_market_paper: true
  abstract: "As opposition to an authoritarian regime strengthens, which members of the security apparatus remain loyal? Conventional accounts of ethnic stacking predict that the autocrat's coethnics will be the most reliable supporters. Conversely, this paper demonstrates that minority personnel can, in fact, engage in loyalty overcompensation, displaying more steadfast support for the regime than their majority-group colleagues, who are the autocrat's coethnics. Using uniquely identified electoral data on security forces' voting across three Malaysian elections (2013–2022), this study finds that minority personnel supported the ruling coalition at similar or higher rates than their majority colleagues. Extensive field interviews suggest that identity suppression and coethnic isolation are the key mechanisms driving this behavior. The pattern of minority defections to a progressive opposition coalition during the 2018 transitional election and the 2022 post-authoritarian election is inconsistent with a materialist explanation. These findings challenge assumptions about stacked security forces' loyalties, highlighting the importance of intra-organizational dynamics."
  # pdf: "files/koo_jmp.pdf"

- title: "Collective Punishment of the Other: Perceptions of Groupness and Public Responses to Foreign Influence"
  section: working
  coauthors: ['<a href="https://www.jonathanchu.org/" target="_blank" rel="noopener">Jonathan Chu</a> (National University of Singapore)']
  status: "under review"
  abstract: "When rival governments interfere in each other’s domestic affairs, disclosures of that interference often trigger demands for “collective punishment”—broadly punitive policies impacting the rival country’s ordinary citizens. Why do people support such indiscriminate policies that impose costs on an entire national group? We argue that people’s support for such measures is rooted in their perceptions of a national outgroup’s “groupness,” comprising two fundamental properties: entitativity/cohesion and essence/quality. These perceptions raise the perceived collective agency of outgroup nationals, making its members appear more threatening and responsible for their government’s actions. Our analysis of original U.S. policymaker and the mass public surveys shows consistent support for the argument. We also test two information interventions designed to reduce collective punishment preferences, finding that individual-level humanizing portrayals of outgroup members outperform group-level corrective information. The paper provides a new microfoundational account of how great power competition generates domestic pressure for discriminatory policies."

